image: gitlab.derekwilliams.biz:5050/dealer-gears/dg-android/docker-java

stages:
  - build
  - deploy

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=false  

cache:
  key: 
    files:
      - pom.xml
  paths:
    - .m2/repository

java-build-and-test:
  stage: build
  variables:
    APP_SECURITY_SALT: $APP_SECURITY_SALT        
    SPRING_DATASOURCE_URL: $SPRING_DATASOURCE_URL
    SPRING_DATASOURCE_USERNAME: $SPRING_DATASOURCE_USERNAME
    SPRING_DATASOURCE_PASSWORD: $SPRING_DATASOURCE_PASSWORD
    SPRING_JPA_DATABASE_PLATFORM: $SPRING_JPA_DATABASE_PLATFORM
    SPRING_JPA_HIBERNATE_DDL_AUTO: $SPRING_JPA_HIBERNATE_DDL_AUTO      
    SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: $SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
    APP_JWTSECRET: $APP_JWTSECRET
    APP_JWTEXPIRATIONMS: $APP_JWTEXPIRATIONMS
    APP_JWTSIGNINGALGORITHM: $APP_JWTSIGNINGALGORITHM
    APP_JWTREFRESHEXPIRATIONMS: $APP_JWTREFRESHEXPIRATIONMS
    APP_SECURITY_ALGORITHM: $APP_SECURITY_ALGORITHM
    APP_SECURITY_CORS_ALLOWED_ORIGIN: $APP_SECURITY_CORS_ALLOWED_ORIGIN
    SPRING_MAIL_HOST: $SPRING_MAIL_HOST
    SPRING_MAIL_PORT: $SPRING_MAIL_PORT
    SPRING_MAIL_USERNAME: $SPRING_MAIL_USERNAME
    SPRING_MAIL_PASSWORD: $SPRING_MAIL_PASSWORD
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    name: "Maven artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    paths:
      - "**/target"
    reports:
      # declare the JUnit reports (recursive pattern for multi-module projects)
      junit:
        - "**/target/*-reports/TEST-*.xml"

deploy:
  stage: deploy
  ## service: docker-in-docker
  type: manual
  variables:
    ## variables to connect with docker
  script: 
    - mvn -Dspring-boot.build-image.imageName=docker.io/derekvasilich/dg-spring-boot:latest spring-boot:build-image
    - docker push docker.io/derekvasilich/dg-spring-boot:latest
  environment: production
